name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned (was `latest`): bun 1.3.14 changed mock.module / module-cache behavior so the
          # order-sensitive @upstash/redis mocks in src/lib/__tests__/{budget,ratelimit}.test.ts
          # no longer apply when the module is first imported by another test file, failing 11
          # tests that pass on 1.3.13. Pin to the validated toolchain for reproducible CI; bump
          # deliberately once the mocks are made load-order-independent (preload).
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test
      # Deliberately excluded from CI:
      # - Playwright e2e (test:e2e): needs a running dev server + a browser download,
      #   so it stays a local / pre-release step rather than a per-push gate.
      # - bun run build: Vercel already builds every push to main, so duplicating the
      #   build here would double CI time for little added signal.
