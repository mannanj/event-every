name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI only. The original "bun 1.3.14 broke mock.module" theory
          # was DISPROVEN — run 27489841618 ran on 1.3.13 and still failed. The real cause was an
          # @upstash/redis mock collision between budget.test.ts and ratelimit.test.ts (each
          # registered its own global mock.module; load order differs Linux vs macOS). That is now
          # fixed order-independently via a single shared preload (src/lib/__tests__/_redisMock.ts,
          # wired through bunfig.toml), so the bun version is no longer load-bearing.
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test
      # Deliberately excluded from CI:
      # - Playwright e2e (test:e2e): needs a running dev server + a browser download,
      #   so it stays a local / pre-release step rather than a per-push gate.
      # - bun run build: Vercel already builds every push to main, so duplicating the
      #   build here would double CI time for little added signal.
