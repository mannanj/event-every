name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI; matches local dev. (The @upstash/redis test flakiness that
          # once motivated investigating bun versions is fixed structurally via dependency
          # injection — see src/lib/redisClient.ts — so the version is no longer load-bearing.)
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      # `bun run test` is `bun test src --parallel`. --parallel gives the same fresh-global
      # isolation as --isolate but runs files in separate worker processes. Single-process
      # --isolate segfaults on bun 1.3.13 (JSC "Heap Helper Thread", EXC_BAD_ACCESS) once the
      # suite passes ~35 test files, because the concurrent GC races with per-file global
      # teardown inside one VM. That is an upstream bun bug, not a test-order problem.
      - run: bun run test
      # The MCP Worker is its own package with its own dependencies, and the
      # root tsconfig excludes it. Without these two lines nothing anywhere
      # compiles it: it shipped once already having never been through tsc, and
      # an audit found three real errors the moment it finally was.
      - run: bun install --frozen-lockfile
        working-directory: mcp
      - run: bun run type-check
        working-directory: mcp
      # Deliberately excluded from CI:
      # - Playwright e2e (test:e2e): needs a running dev server + a browser download,
      #   so it stays a local / pre-release step rather than a per-push gate.
      # - bun run build: Vercel already builds every push to main, so duplicating the
      #   build here would double CI time for little added signal.
